<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Collection Master v1.8</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sticky header + tabs (same on every page) -->
    <header class="header">
      <div class="header-top">
        <div class="logo-wrap">
          <button class="logo" data-page="home">Collection Master</button>
          <span class="build-number">v1.8</span>
        </div>
        <div class="stats-inline">
          <span id="money">$0</span>
          <span id="income">$0/s</span>
        </div>
      </div>

      <nav class="tabs">
        <button class="tab" data-page="home">Home</button>
        <button class="tab" data-page="path">Path</button>
        <button class="tab" data-page="conveyor">Conveyor</button>
        <button class="tab" data-page="expeditions">Expeditions</button>
        <button class="tab" data-page="collections">Collections</button>
        <button class="tab" data-page="events">Events</button>
        <button class="tab" data-page="achievements">Achievements</button>
        <button class="tab" data-page="tokens">Tokens</button>
      </nav>
    </header>

    <!-- Page content swaps here -->
    <main id="page-content"></main>
  </div>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
